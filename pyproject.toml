[project]
name = "food-recommendation-agent"
version = "0.1.0"
description = "Nutrition Specialist Graph Workflow Agent using ADK 2.0"
authors = [
    {name = "Nutrition Specialist Team", email = "nutrition-team@example.com"},
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=2.5.0,<3.0.0",
    "google-genai>=2.18.0",
    "pydantic>=2.7.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app"]
